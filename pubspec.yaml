name: nvit_app
description: "KK Nutrivet - Animal Nutrition & Veterinary Care mobile app."
publish_to: 'none'

version: 1.0.6+12

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  flutter_riverpod: ^2.6.1
  go_router: ^18.1.4
  dio: ^5.7.0
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  firebase_messaging: ^17.1.0
  firebase_analytics: ^13.1.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0
  cached_network_image: ^4.0.7
  shared_preferences: ^2.3.3
  intl: ^0.20.3
  google_fonts: ^9.0.0
  flutter_svg: ^2.5.1
  shimmer: ^4.0.0
  fluttertoast: ^10.0.3
  image_picker: ^1.1.2
  http_parser: ^4.1.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  permission_handler: ^13.0.2
  connectivity_plus: ^7.3.1
  share_plus: ^13.3.1
  firebase_crashlytics: ^6.1.0
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  in_app_update: ^5.0.0
  lottie: ^3.8.2
  video_player: ^2.9.2
  geolocator: ^14.1.2

  material_ui: any
  cupertino_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/images/
    - assets/images/animal-categories/
    - assets/images/category/
    - assets/marketing_image/

  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 800
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 900
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 900
