name: nvit_app
description: "KK Nutrivet - Animal Nutrition & Veterinary Care mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.7.0
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.4.0
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0
  fluttertoast: ^10.0.0
  image_picker: ^1.1.2
  http_parser: ^4.1.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0
  share_plus: ^12.0.2
  firebase_crashlytics: ^4.3.10
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  lottie: ^3.6.1
  video_player: ^2.9.2
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/images/
    - assets/images/animal-categories/
    - assets/images/category/
    - assets/marketing_image/

  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 800
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 900
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 900
